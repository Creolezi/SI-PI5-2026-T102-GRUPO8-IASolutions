<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Solutions - Diagnóstico</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="vscode-container">
        <!-- Sidebar fake -->
        <aside class="sidebar">
            <div class="sidebar-icon active">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
            </div>
            <div class="sidebar-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
        </aside>
        
        <!-- Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <h2>PI5_GRUPO8_ATENDIMENTO.py <span class="badge">IA Solutions</span></h2>
            </header>
            
            <div class="chat-history" id="chatHistory">
                <div class="message system-msg">
                    <div class="avatar">IA</div>
                    <div class="content">
                        <p>Olá! Sou o sistema de recomendação do Grupo 8.</p> 
                        <p>Descreva o problema que o cliente está relatando e eu usarei a similaridade matemática de <strong>Cálculos de Cosseno</strong> e Inteligência de <strong>NLP</strong> para diagnosticar as possibilidades.</p>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-container">
                <form id="chatForm">
                    <input type="text" id="userInput" placeholder="Ex: Câmeras offline e cabo quebrado..." autocomplete="off">
                    <button type="submit" id="sendBtn">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="none" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                    </button>
                </form>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
